# HTTPS for the server's HTTP side, with Caddy in front of it: players' passwords (sign-up and the
# launcher's sign-in) go over HTTPS. Needs a domain whose DNS points at this machine, and ports
# 80 and 443 open to it. Put CROSSCOM_DOMAIN in docker/.env with the other settings, then from
# the repository root:
#
#   docker compose -f docker/compose.yaml -f docker/compose.https.yaml up -d
#
# Caddy takes port 80 from the server: it passes on what the game and the overlay ask over plain
# HTTP (the online config, GET /api/...) and sends the rest to HTTPS. See docker/Caddyfile and
# docs/hosting.md. Needs Docker Compose 2.24.4 or later (for !override).
services:
  server:
    environment:
      # Caddy's address below: the server believes its X-Forwarded-For and X-Forwarded-Proto.
      CROSSCOM_TRUSTED_PROXIES: 172.31.80.10
    # Only Caddy reaches port 80 now; the game's UDP ports stay as they are.
    ports: !override
      - "21030:21030/udp"    # sign-in
      - "21031:21031/udp"    # game services
    networks:
      - https

  caddy:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    depends_on:
      - server
    environment:
      CROSSCOM_DOMAIN: ${CROSSCOM_DOMAIN:?set CROSSCOM_DOMAIN to the server's domain}
    ports:
      - "80:80/tcp"          # the game's online config (plain HTTP), certificates
      - "443:443/tcp"        # HTTPS: the launcher's and the client's API calls
      - "443:443/udp"        # HTTP/3
    networks:
      https:
        ipv4_address: 172.31.80.10
    # Caddy's binary may bind ports below 1024; it needs nothing else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates and keys
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

# Caddy's address is fixed so the server can trust it alone. Change the subnet, the address and
# CROSSCOM_TRUSTED_PROXIES together if 172.31.80.0/24 is in use here.
networks:
  https:
    ipam:
      config:
        - subnet: 172.31.80.0/24
          ip_range: 172.31.80.128/25   # the others' addresses, apart from Caddy's

volumes:
  caddy_data:
  caddy_config:
