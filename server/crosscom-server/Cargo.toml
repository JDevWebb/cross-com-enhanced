[package]
name = "crosscom-server"
version = "0.1.0"
edition = "2021"
description = "The Cross-Com server: online config, sign-in and the game's online services"

[[bin]]
name = "crosscom-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
grfs_protocols = { path = "../grfs_protocols" }
quazal = { path = "../../quazal" }
rand = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
sloggers = { workspace = true }
sodiumoxide = { workspace = true }
toml = { workspace = true }
