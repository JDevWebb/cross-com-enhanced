[package]
name = "crosscom-server"
version = "0.1.0"
edition = "2021"
description = "The Cross-Com server: online config, sign-in and the game's online services"

[[bin]]
name = "crosscom-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
byteorder = { workspace = true }
grfs_protocols = { path = "../grfs_protocols" }
quazal = { path = "../../quazal" }
rand = { workspace = true }
# Players' identities: their accounts are theirs by key, with no password (accounts.rs).
crosscom-identity = { path = "../../identity" }
# Game tokens are kept as SHA-256 hashes (accounts.rs).
sha2 = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTPS of its own (tls.rs), for a server hosted at home: rustls with ring, as the launcher's, and
# a certificate it makes itself; socket2 to pass requests on from the address it trusts.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
socket2 = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
sloggers = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The client's address echo and reach packets, checked against what the server reads and sends.
crosscom-client-net = { path = "../../client/net" }
