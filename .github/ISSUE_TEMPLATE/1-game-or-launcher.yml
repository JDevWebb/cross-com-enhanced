name: Game or launcher problem
description: The launcher, the in-game overlay (F5), progression, stats or a crash. Something on your PC.
labels: ["bug", "client"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Can't join, host or stay in a match? Use **Can't join, host or stay connected** instead: it asks for what those need.
        Security problems go privately to the maintainer, not here: see [SECURITY.md](https://github.com/JDevWebb/cross-com-enhanced/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: What's affected
      options:
        - The launcher (setup, settings, the DLC check)
        - The in-game overlay (F5)
        - Signing in, or making an account
        - Progression, unlocks or loadouts
        - Stats, leaderboards or challenges
        - Friends, squads or invitations
        - The game crashes or freezes
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The launcher's About page, or its title bar.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Where you play
      options:
        - Windows 11
        - Windows 10
        - Linux (Wine or Proton)
    validations:
      required: true
  - type: dropdown
    id: copy
    attributes:
      label: Your copy of the game
      options:
        - Ubisoft Connect
        - Steam
        - Other
    validations:
      required: true
  - type: dropdown
    id: directx
    attributes:
      label: DirectX
      description: Settings in the launcher (Use DirectX 9).
      options:
        - DirectX 11
        - DirectX 9
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead, and roughly when (with your time zone). Exact messages help most (a screenshot is fine).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. "It happened once" is useful too.
      placeholder: |
        1. Start the launcher
        2. Press Play
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        After each game you play online the launcher sends its log to the server you played on, and **Settings › Logs › Send now** sends it straight away: say when, and that's usually enough. The logs are also in the game's folder: `crosscom.log`, and the `logs` folder (**Open logs folder** in Settings).
        **Read a log before pasting it here:** it can contain your PC's name and your internet address.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I looked for an existing issue about this.
          required: true
        - label: I removed anything private from what I pasted (or only sent the logs from the launcher).
          required: true
        - label: I sent the logs from the launcher (Settings › Logs › Send now).
