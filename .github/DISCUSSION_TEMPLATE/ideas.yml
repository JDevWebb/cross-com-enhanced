body:
  - type: markdown
    attributes:
      value: |
        Something new, or better. Have a look at the [open issues](https://github.com/JDevWebb/cross-com-enhanced/issues) first: it may be asked for already.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and the problem it solves for you or your group.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it might work
      description: Optional. Where it would show in the launcher, the overlay or the game, and what it would do.
