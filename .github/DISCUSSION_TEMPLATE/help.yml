body:
  - type: markdown
    attributes:
      value: |
        Ask anything about setting up, signing in, the launcher, the overlay or the DLC packs. When an answer works, mark it as the answer so the next person finds it.
        Something clearly broken (a crash, an error that keeps coming back)? An [issue](https://github.com/JDevWebb/cross-com-enhanced/issues/new/choose) is better.
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The launcher's About page, or its title bar.
      placeholder: "0.1.0"
  - type: dropdown
    id: system
    attributes:
      label: Where you play
      options:
        - Windows 11
        - Windows 10
        - Linux (Wine or Proton)
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do, what you tried, and what happened. Exact messages help most (a screenshot is fine).
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Logs:** send them from the launcher (Settings › Logs › Send logs now) and say when you sent them. If you paste a log here, read it first: it can contain your PC's name and your internet address.
