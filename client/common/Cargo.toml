[package]
name = "crosscom-client-common"
version = "0.1.0"
edition = "2021"
description = "What both client DLLs share: the settings file, the log and its runs, the saves and the server's info"

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# HTTPS to the server's API (http.rs): rustls with ring and the Mozilla roots built in, as the
# launcher has.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# HTTPS to a server known by its certificate's fingerprint (a host's join code; http.rs), which
# ureq can't be told to check: rustls itself, as ureq's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Windows version, for the logs sent to the server (system.rs).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
# A server with a certificate of its own, for the pinned HTTPS test (http.rs).
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
