[workspace]
members = [
  "client/common",
  "client/orbit",
  "client/uplay",
  "quazal",
  "quazal/quazal-macros",
]
resolver = "2"

[profile.release]
strip = true
lto = "fat"

[workspace.dependencies]
byteorder = "1.5"
derive_more = "2.0"
enumflags2 = "0.7"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
miniz_oxide = "0.8"
num_enum = "0.7"
num-traits = "0.2"
proc-macro-crate = "3.1"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slog = { version = "2.7", features = ["max_level_trace"] }
sloggers = { version = "2.0", features = ["json"] }
sodiumoxide = "0.2"
syn = "2.0"
toml = "0.9"
