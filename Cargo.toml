[workspace]
members = [
  "client/common",
  "client/orbit",
  "client/uplay",
  "launcher",
  "quazal",
  "quazal/quazal-macros",
  "server/crosscom-server",
  "server/grfs_protocols",
  "tools/quazal-tools",
  "tools/testbot",
  "tools/quazal-tools/quazal-tools-macros",
]
resolver = "2"
# Third-party crates kept here with patches of our own (each folder's PATCHES.md says which).
exclude = ["vendor"]

[patch.crates-io]
# The overlay's graphics hook: hudhook 0.8.1 with fixes for its DirectX 9 vertex buffer and for
# systems that won't make the DirectX 11 dummy device it hooks through. See vendor/hudhook/PATCHES.md.
hudhook = { path = "vendor/hudhook" }
# imgui-rs with the fix for imgui-rs/imgui-rs#775 (a panic under hudhook), until a release has it.
imgui = { git = "https://github.com/imgui-rs/imgui-rs", rev = "cb8beeb" }

[profile.release]
strip = true
lto = "fat"

[workspace.dependencies]
byteorder = "1.5"
derive_more = "2.0"
enumflags2 = "0.7"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
miniz_oxide = "0.8"
num_enum = "0.7"
num-traits = "0.2"
proc-macro-crate = "3.1"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slog = { version = "2.7", features = ["max_level_trace"] }
sloggers = { version = "2.0", features = ["json"] }
sodiumoxide = "0.2"
syn = "2.0"
toml = "0.9"
convert_case = "0.8"
etherparse = "0.19"
nom = "7.1"
pcap-parser = { version = "0.17", features = ["data"] }
eyre = "0.6"
tokio = { version = "1.36", features = ["rt-multi-thread"] }
