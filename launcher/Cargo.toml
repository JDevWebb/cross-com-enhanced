[package]
name = "crosscom-launcher"
version = "0.1.0"
edition = "2021"
description = "The launcher's work, without its window: finding the game, installing the client built into it, its settings, and talking to a server"

[lib]
path = "src/lib.rs"

[features]
# The client DLLs built in: CROSSCOM_CLIENT_DIR names the folder holding the two (the release
# build sets it), and the launcher installs them from itself.
embed-dlls = []

[dependencies]
crosscom-client-common = { path = "../client/common" }
# The player's identity: the key that signs them in, in place of a password.
crosscom-identity = { path = "../identity" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# HTTPS for the API: rustls with ring and the Mozilla roots built in, nothing from the system.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# The launcher's updates: the release key's Ed25519 signature and SHA-256 (ring, which rustls
# brings anyway), and the signature's base64.
ring = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Asking Windows' permission to add the game's firewall rules (`firewall`), where Windows' own
# programs are (`windows_dirs`), and encrypting the player's identity for the Windows user
# (`identity`).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
