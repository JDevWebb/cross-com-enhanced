[package]
name = "crosscom-launcher"
version = "0.1.0"
edition = "2021"
description = "The launcher's work, without its window: finding the game, installing the client built into it, its settings, and talking to a server"

[lib]
path = "src/lib.rs"

[features]
# The client DLLs built in: CROSSCOM_CLIENT_DIR names the folder holding the two (the release
# build sets it), and the launcher installs them from itself.
embed-dlls = []

[dependencies]
crosscom-client-common = { path = "../client/common" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# HTTPS for passwords: rustls with ring and the Mozilla roots built in, nothing from the system.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Asking Windows' permission to add the game's firewall rules (`firewall`).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
